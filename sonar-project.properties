# SonarQube Community Edition configuration for Strelit UI Kit
# Set SONAR_HOST_URL and SONAR_TOKEN in the scan environment.

# Project identification
sonar.projectKey=strelit-ui-kit
sonar.projectName=Strelit UI Kit
sonar.projectVersion=1.0.0
sonar.projectDescription=Strelit UI layout workspace toolkit

# Source and Test configuration
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/specs/**/*-tests.ts,test/bench/**/*-bench.ts
sonar.exclusions=node_modules/**,dist/**,lib/**,temp/**,.tmp/**,.generated-docs/**,apitest/**,scripts/**,coverage/**,**/*.d.ts

# TypeScript / JavaScript analysis configuration
sonar.typescript.tsconfigPaths=tsconfig.module.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
