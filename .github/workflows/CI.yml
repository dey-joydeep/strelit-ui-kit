name: CI
on:
    - push
    - pull_request

jobs:
    verify:
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
                node_version:
                    - 20
                    - 22
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node_version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify
              run: npm run verify:ordered

            - name: Test
              run: npm run test

            - name: Demo Build
              run: npm run apitest:build
