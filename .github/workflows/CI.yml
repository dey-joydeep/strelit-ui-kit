name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node_version:
          - 20
          - 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pull request risk
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.before) || format('origin/{0}', github.event.repository.default_branch) }}
          GITHUB_DEFAULT_BRANCH: origin/${{ github.event.repository.default_branch }}
          GITHUB_FORCE_RISK: ${{ github.ref_type == 'tag' && 'high' || '' }}
        run: npm run verify:pr
